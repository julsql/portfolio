# Bootstrap config (HTTP only). Apply this first, reload nginx, then run:
#   sudo certbot --nginx -d portfolio.julsql.fr
# Certbot rewrites this file in place: it adds the `listen 443 ssl` block with
# the cert paths and a 80 -> 443 redirect (like thecode.julsql.fr).
server {
    listen 80;
    server_name portfolio.julsql.fr;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_log /var/log/nginx/portfolio_error.log;
    access_log /var/log/nginx/portfolio_access.log;
}
