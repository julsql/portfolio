server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for fingerprinted assets, no cache for the HTML shell.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static game assets shipped from /public/ keep stable filenames, so we
    # tag them immutable too — without this every SFX play and every Link
    # animation frame in prod hit the network for a 304 round-trip, which
    # is exactly the lag reported on slow links.
    location ^~ /sound/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /sprites/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SEO files: serve as-is, never fall back to the SPA shell.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Missing static files (anything with an extension) are real 404s.
    # Root-level static files (favicon, apple-touch-icon, og-image…) get a
    # moderate cache since their names are not fingerprinted.
    location ~* \.(?:js|mjs|css|map|json|xml|txt|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|mp3|ogg|wav)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Brotli needs a module absent from nginx:alpine; gzip covers every text type.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
        application/xml application/ld+json image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;
}
