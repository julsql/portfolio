name: Build & push image

# Construit l'image du site et la pousse sur GHCR (privee).
# Le deploiement est declenche par la CI : notification a Keel (webhook) apres le push.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # julsql/portfolio

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Keel to redeploy
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            https://keel.julsql.fr/v1/webhooks/native \
            -u "${{ secrets.KEEL_WEBHOOK_AUTH }}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ghcr.io/julsql/portfolio","tag":"latest"}'
